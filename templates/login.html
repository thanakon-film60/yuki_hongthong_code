<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบหลังบ้าน · Yuki CardVault</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Kanit',sans-serif;background:linear-gradient(160deg,#0f172a,#111827);color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:34px;width:100%;max-width:380px;text-align:center}
  h1{font-size:1.5rem;font-weight:700;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#94a3b8;font-size:.9rem;margin:6px 0 22px;font-weight:300}
  input{width:100%;padding:13px 16px;border-radius:11px;border:1px solid #334155;background:#273449;color:#e2e8f0;font-family:inherit;font-size:1rem;margin-bottom:14px}
  input:focus{outline:none;border-color:#38bdf8}
  button{width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(90deg,#38bdf8,#818cf8);color:#0f172a;font-weight:600;font-family:inherit;font-size:1rem;cursor:pointer}
  .err{color:#f87171;font-size:.85rem;margin-bottom:12px}
  a{color:#38bdf8;font-size:.82rem;text-decoration:none;display:inline-block;margin-top:18px}
  .lock{font-size:2.4rem;margin-bottom:8px}
</style>
</head>
<body>
  <form class="box" method="POST" action="/login">
    <div class="lock">🔒</div>
    <h1>เข้าสู่ระบบหลังบ้าน</h1>
    <p>สำหรับเจ้าของคลังเท่านั้น</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="รหัสผ่าน" autofocus required>
    <button type="submit">เข้าสู่ระบบ</button>
    <a href="/">← กลับไปหน้าบ้าน</a>
  </form>
</body>
</html>
